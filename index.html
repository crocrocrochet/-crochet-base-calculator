<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>包底針數生成器</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

    <section class="rule-guide">
    <h2 class="rule-guide-title">包底加針規律</h2>

    <div class="rule-button-group">
        <button
            type="button"
            class="rule-button"
            data-rule-target="ovalRulePanel"
        >
            橢圓加針規律
        </button>

        <button
            type="button"
            class="rule-button"
            data-rule-target="squareRulePanel"
        >
            方形加針規律
        </button>
    </div>

    <!-- 橢圓規律圖片 -->
    <div
        id="ovalRulePanel"
        class="rule-panel"
        hidden
    >
        <div class="rule-panel-header">
            <h3>橢圓加針規律</h3>

            <button
                type="button"
                class="rule-close-button"
                aria-label="關閉橢圓加針規律"
            >
                ×
            </button>
        </div>

        <div class="rule-image-list">
            <img
                src="./oval-rule-1.png"
                alt="橢圓包底第一圈及第二圈加針規律"
                loading="lazy"
            >

            <img
                src="./oval-rule-2.png"
                alt="橢圓包底第三圈及第四圈加針規律"
                loading="lazy"
            >

            <img
                src="./oval-rule-3.png"
                alt="橢圓包底起針十一針的加針範例"
                loading="lazy"
            >

            <img
                src="./oval-rule-4.png"
                alt="橢圓包底每組加針規律"
                loading="lazy"
            >
        </div>
    </div>

    <!-- 方形規律圖片 -->
    <div
        id="squareRulePanel"
        class="rule-panel"
        hidden
    >
        <div class="rule-panel-header">
            <h3>方形加針規律</h3>

            <button
                type="button"
                class="rule-close-button"
                aria-label="關閉方形加針規律"
            >
                ×
            </button>
        </div>

        <div class="rule-image-list">
            <img
                src="./oval-rule-5.png"
                alt="方形包底加針規律"
                loading="lazy"
            >
        </div>
    </div>
</section>

    
        <h1>🧶 包底針數生成器</h1>

        <p class="instruction">以下選項請三選二填寫</p>

        <label for="patternSize">花樣針數</label>
        <input
            type="number"
            id="patternSize"
            min="1"
            step="1"
            placeholder="例如：8"
        >

        <label for="patternCount">花樣組數</label>
        <input
            type="number"
            id="patternCount"
            min="1"
            step="1"
            placeholder="例如：12"
        >

        <label for="totalStitches">大約總針數</label>
        <input
            type="number"
            id="totalStitches"
            min="1"
            step="1"
            placeholder="例如：96"
        >

        <button id="calculateBtn">
            開始計算
        </button>

        <div id="result" aria-live="polite">
            計算結果將顯示在這裡
        </div>

    </div>

    


    <div class="dynamic-watermark" aria-hidden="true">
        @crocrocrochet
    </div>

    <main class="container">
        <!-- 原本內容 -->
    </main>

<script src="translations.js"></script>
<script src="script.js"></script>
</body>

</html>
